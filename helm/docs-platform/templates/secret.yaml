{{- if not .Values.webhook.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docs-platform.fullname" . }}
  labels:
    {{- include "docs-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.webhook.secretKey }}: {{ required "Set webhook.secret or webhook.existingSecret" .Values.webhook.secret | quote }}
{{- end }}
